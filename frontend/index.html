<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrialMatch</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>TrialMatch</h1>
      <p>Find recruiting clinical trials that may fit your profile.</p>
    </header>

    <section class="search-panel">
      <label for="query">Describe your situation</label>
      <textarea
        id="query"
        rows="4"
        placeholder="Example: I am a 45 year old female with type 2 diabetes living in Boston. HbA1c is 8.1 and BMI is 31."
      ></textarea>
      <button id="search-btn" type="button">Search trials</button>
    </section>

    <section id="status" class="status hidden"></section>

    <section id="profile" class="profile hidden"></section>

    <section id="results" class="results"></section>

    <footer>
      <p id="disclaimer" class="disclaimer hidden"></p>
    </footer>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
